<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracajá no Paraguai</title>
<style>
:root{--main:#9a6a2a;--deep:#6b4614;--soft:#f8f1e4;--line:#ecdcbf;--ink:#10212b;--mut:#4d6370}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px;letter-spacing:-.01em}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem;font-variant-numeric:tabular-nums}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.btn.grande{font-size:1.1rem;padding:14px 30px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.capa canvas{width:100%;height:auto;border-radius:14px;display:block}
.como{display:grid;gap:8px;margin-top:10px}.como div{display:flex;gap:10px;align-items:baseline;background:var(--soft);border-radius:12px;padding:10px 12px}.como b{color:var(--deep);min-width:72px}
.guia{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.ficha{border:2px solid var(--line);border-radius:14px;padding:8px;background:#fff}
.ficha canvas{border:0;border-radius:10px;background:var(--soft)}
.ficha b{display:block;margin-top:6px;font-size:.92rem;color:var(--deep)}
.ficha i{display:block;font-size:.78rem;color:var(--mut)}
.ficha span{display:block;font-size:.8rem;margin-top:3px}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;padding:2px 8px;margin-top:5px}
.tag.sim{background:#e8f5e9;color:#1b5e20}.tag.nao{background:#ffebee;color:#8e1b1b}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.selo{display:inline-block;padding:8px 18px;border-radius:999px;font-weight:800;font-size:1.2rem;margin-bottom:6px}.selo.ok{background:#e8f5e9;color:#2e7d32}.selo.no{background:#fff3e0;color:#e65100}
.nota{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:12px;text-align:left;font-size:.9rem}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>Tracajá no Paraguai</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR"></span><span class="pill" id="hV"></span><span class="pill" id="hT"></span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hsh=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v);};
function lg(k,x0,y0,x1,y1,st){const g=k.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function rg(k,x,y,r0,r1,st){const g=k.createRadialGradient(x,y,r0,x,y,r1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
const CACHE={};
function cache(key,w,h,fn){const id=key+'_'+w+'x'+h;if(!CACHE[id]){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);CACHE[id]=c;}return CACHE[id];}

/* ================= ESPÉCIES E ITENS ================= */
const ID={
 unifilis:{nome:'Tracajá',sci:'Podocnemis unifilis',alvo:true,pista:'Exótico no Pantanal. Pista do jogo: manchas amarelas na cabeça.'},
 geoffroanus:{nome:'Cágado-de-barbicha',sci:'Phrynops geoffroanus',alvo:false,pista:'Nativo. Pista do jogo: barbelas sob o queixo e faixa escura no olho.',erro:'Cágado-de-barbicha é nativo. Veja as barbelas.'},
 macrocephala:{nome:'Cágado-do-pantanal',sci:'Acanthochelys macrocephala',alvo:false,pista:'Nativo do Pantanal e do Chaco. Pista do jogo: cabeça muito grande.',erro:'Cágado-do-pantanal é nativo. Veja a cabeça grande.'},
 ninhoT:{nome:'Ninho de tracajá',sci:'cova na areia',alvo:true,pista:'Cova na areia da praia, com rastro de patas até a água.'},
 ninhoJ:{nome:'Ninho de jacaré',sci:'monte de folhas',alvo:false,pista:'Monte de folhas e galhos junto ao mato. Fica fora do registro.',erro:'Monte de folhas é ninho de jacaré, não de tracajá.'},
 filhote:{nome:'Filhote de tracajá',sci:'Podocnemis unifilis',alvo:true,pista:'Pequeno, já com as manchas amarelas na cabeça.'},
 jacare:{nome:'Jacaré-do-pantanal',sci:'Caiman yacare',alvo:false,pista:'Réptil nativo, mas não é quelônio. Fica fora do registro.',erro:'Jacaré-do-pantanal não é quelônio.'}
};
const QP={
 unifilis:{dome:34,cA:'#5f5c43',cB:'#2e2c21',rim:'#2a2820',leg:'#4b493b',hc:'#34332c',head:12,neck:16},
 geoffroanus:{dome:21,cA:'#7d6749',cB:'#45362a',rim:'#3a2e24',leg:'#6a5d4f',hc:'#6a6052',head:11,neck:24},
 macrocephala:{dome:29,cA:'#55422f',cB:'#271d16',rim:'#21190f',leg:'#3d342b',hc:'#3b3129',head:18,neck:11}
};

/* ================= ARTE ================= */
function quelonio(c,x,y,L,sp,d,ph,fil){
 const P=QP[sp];c.save();c.translate(x,y);c.scale(d||1,1);const k=L/100,dm=P.dome,lw=v=>Math.max(.6,v*k);
 c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(0,0,54*k,5*k,0,0,7);c.fill();
 const pa=fil?Math.sin((ph||0)*3)*.5:0;
 c.fillStyle=P.leg;
 c.beginPath();c.ellipse(-34*k,-3*k,11*k,6*k,-.5+pa,0,7);c.fill();
 c.beginPath();c.ellipse(32*k,-3*k,11*k,6*k,.5-pa,0,7);c.fill();
 c.fillStyle='#d9cfb2';for(let i=0;i<3;i++){c.beginPath();c.arc(37*k+i*3.2*k,1.5*k,1.2*k,0,7);c.fill();}
 c.fillStyle=P.leg;c.beginPath();c.moveTo(-46*k,-9*k);c.lineTo(-60*k,-3*k);c.lineTo(-46*k,-3*k);c.fill();
 const hb=Math.sin(ph||0)*.9*k,hr=P.head*k*(fil?1.35:1),hx=(50+P.neck)*k,hy=-(12+P.neck*.45)*k+hb;
 c.strokeStyle=P.leg;c.lineWidth=P.head*1.05*k*(fil?1.2:1);c.lineCap='round';c.beginPath();c.moveTo(36*k,-12*k);c.quadraticCurveTo(46*k,-12*k,hx-hr*.5,hy+hr*.1);c.stroke();
 c.fillStyle=P.hc;c.beginPath();c.ellipse(hx,hy,hr*1.15,hr*.8,-.1,0,7);c.fill();
 c.beginPath();c.moveTo(hx+hr*.7,hy-hr*.5);c.quadraticCurveTo(hx+hr*1.7,hy-hr*.25,hx+hr*1.6,hy+hr*.2);c.quadraticCurveTo(hx+hr*1.1,hy+hr*.58,hx+hr*.5,hy+hr*.55);c.fill();
 if(sp==='geoffroanus'||sp==='macrocephala'){c.save();c.beginPath();c.ellipse(hx,hy,hr*1.15,hr*.8,-.1,0,7);c.moveTo(hx+hr*.7,hy-hr*.5);c.quadraticCurveTo(hx+hr*1.7,hy-hr*.25,hx+hr*1.6,hy+hr*.2);c.quadraticCurveTo(hx+hr*1.1,hy+hr*.58,hx+hr*.5,hy+hr*.55);c.clip();
  c.fillStyle=sp==='geoffroanus'?'#e6dcc0':'#8e7f69';c.fillRect(hx-hr*2,hy+hr*.12,hr*4,hr*2);c.restore();}
 if(sp==='geoffroanus'){c.strokeStyle='#15120f';c.lineWidth=hr*.2;c.lineCap='round';c.beginPath();c.moveTo(hx+hr*1.45,hy-hr*.08);c.lineTo(hx-hr*1.05,hy-hr*.02);c.stroke();
  c.strokeStyle='#cfc3a5';c.lineWidth=lw(1.3);c.beginPath();c.moveTo(hx+hr*.95,hy+hr*.5);c.lineTo(hx+hr*.85,hy+hr*.95);c.moveTo(hx+hr*.6,hy+hr*.52);c.lineTo(hx+hr*.5,hy+hr*.92);c.stroke();}
 if(sp==='unifilis'){c.fillStyle='#f7c31c';const f=fil?1.25:1;
  for(const [ax,ay,rx,ry] of [[-.15,-.6,.34,.17],[-.62,.05,.24,.18],[.15,.55,.3,.14],[1.15,-.27,.2,.12]]){c.beginPath();c.ellipse(hx+ax*hr,hy+ay*hr,rx*hr*f,ry*hr*f,0,0,7);c.fill();}}
 c.fillStyle='#f3efe2';c.beginPath();c.arc(hx+hr*.55,hy-hr*.18,hr*.24,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(hx+hr*.6,hy-hr*.18,hr*.14,0,7);c.fill();
 c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=lw(.9);c.beginPath();c.moveTo(hx+hr*1.5,hy+hr*.18);c.quadraticCurveTo(hx+hr*.9,hy+hr*.38,hx+hr*.3,hy+hr*.28);c.stroke();
 c.fillStyle=P.rim;c.beginPath();c.moveTo(-53*k,-4*k);c.lineTo(52*k,-4*k);c.lineTo(48*k,-10*k);c.lineTo(-49*k,-10*k);c.closePath();c.fill();
 c.fillStyle=lg(c,0,-dm*k,0,-4*k,[P.cA,P.cB]);c.beginPath();c.moveTo(-53*k,-7*k);
 if(sp==='macrocephala'){c.bezierCurveTo(-51*k,-dm*1.12*k,-24*k,-dm*1.16*k,0,-dm*.84*k);c.bezierCurveTo(24*k,-dm*1.16*k,51*k,-dm*1.12*k,53*k,-7*k);}
 else c.bezierCurveTo(-49*k,-dm*1.32*k,47*k,-dm*1.32*k,53*k,-7*k);
 c.closePath();c.fill();
 c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=lw(1);
 for(const sx of [-30,-10,10,30]){c.beginPath();c.moveTo(sx*k,-8*k);c.quadraticCurveTo((sx+3)*k,-dm*.55*k,(sx+1)*k,-dm*(Math.abs(sx)>20?.72:.9)*k);c.stroke();}
 for(let i=-46;i<=46;i+=10){c.beginPath();c.moveTo(i*k,-7*k);c.lineTo(i*k,-12*k);c.stroke();}
 if(sp==='geoffroanus'){c.fillStyle='rgba(30,20,12,.35)';for(const [a,b] of [[-30,.5],[-12,.7],[8,.6],[26,.45],[-20,.35],[16,.3]]){c.beginPath();c.ellipse(a*k,-dm*b*k,3.5*k,2*k,0,0,7);c.fill();}}
 if(sp==='macrocephala'){c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=lw(1.4);c.beginPath();c.moveTo(-6*k,-dm*.86*k);c.quadraticCurveTo(0,-dm*.78*k,6*k,-dm*.86*k);c.stroke();}
 c.fillStyle='rgba(255,255,255,.14)';c.beginPath();c.ellipse(-8*k,-dm*.78*k,24*k,3.6*k,-.04,0,7);c.fill();
 c.restore();}

function jacare(c,x,y,L,d,ph){c.save();c.translate(x,y);c.scale(d||1,1);const k=L/100;
 c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(-8*k,1*k,78*k,5*k,0,0,7);c.fill();
 c.fillStyle='#3f4530';
 for(const lx of [-22,20]){c.beginPath();c.moveTo(lx*k,-6*k);c.lineTo((lx-6)*k,0);c.lineTo((lx+6)*k,0);c.lineTo((lx+5)*k,-6*k);c.fill();}
 const t=Math.sin(ph||0)*2*k;
 c.fillStyle=lg(c,0,-20*k,0,0,['#5a6140','#3f4530']);
 c.beginPath();c.moveTo(-24*k,-14*k);c.quadraticCurveTo(-60*k,-10*k,-96*k,-2*k+t);c.lineTo(-96*k,0+t);c.quadraticCurveTo(-60*k,-1*k,-24*k,-2*k);c.closePath();c.fill();
 c.beginPath();c.ellipse(0,-8*k,34*k,9.5*k,0,0,7);c.fill();
 c.beginPath();c.moveTo(24*k,-15*k);c.quadraticCurveTo(40*k,-17*k,48*k,-12*k);c.lineTo(80*k,-8*k);c.quadraticCurveTo(84*k,-6*k,80*k,-4*k);c.lineTo(28*k,-2*k);c.closePath();c.fill();
 c.fillStyle='#a49d70';c.beginPath();c.moveTo(-30*k,-3*k);c.quadraticCurveTo(0,0,30*k,-3*k);c.lineTo(30*k,-1.5*k);c.quadraticCurveTo(0,1.5*k,-30*k,-1.5*k);c.fill();
 c.strokeStyle='#e9e3cf';c.lineWidth=Math.max(.6,.9*k);c.beginPath();for(let i=0;i<7;i++){const xx=(48+i*4.5)*k;c.moveTo(xx,-6*k);c.lineTo(xx+1*k,-4*k);}c.stroke();
 c.strokeStyle='rgba(0,0,0,.55)';c.beginPath();c.moveTo(46*k,-7*k);c.lineTo(80*k,-6.2*k);c.stroke();
 c.fillStyle='#2f3423';for(let i=0;i<12;i++){const xx=(-86+i*9)*k,yy=i<6?(-3-i*1.5)*k:-16*k;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+3*k,yy-3*k);c.lineTo(xx+6*k,yy);c.fill();}
 c.fillStyle='rgba(30,30,20,.4)';for(let i=0;i<5;i++){c.fillRect((-88+i*12)*k,(-5-i)*k,4*k,(4+i*.6)*k);}
 c.fillStyle='#4a5034';c.beginPath();c.arc(40*k,-15.5*k,4*k,0,7);c.fill();c.fillStyle='#d7b43a';c.beginPath();c.arc(41*k,-16*k,2*k,0,7);c.fill();c.fillStyle='#111';c.fillRect(40.6*k,-17.6*k,.9*k,3.2*k);
 c.restore();}

function praia(c,x,by,w){c.save();
 c.fillStyle=lg(c,0,by-14,0,by+18,['#f3e3b8','#e2c995','#c2a873']);
 c.beginPath();c.moveTo(x-w/2,by+4);c.bezierCurveTo(x-w*.42,by-16,x+w*.42,by-16,x+w/2,by+4);c.bezierCurveTo(x+w*.4,by+20,x-w*.4,by+20,x-w/2,by+4);c.fill();
 c.strokeStyle='rgba(150,120,70,.25)';c.lineWidth=1;for(let i=0;i<5;i++){const yy=by-6+i*4,ww=w*(.32-i*.04);c.beginPath();c.moveTo(x-ww,yy);c.quadraticCurveTo(x,yy+2,x+ww,yy);c.stroke();}
 c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.5;c.beginPath();c.moveTo(x-w*.4,by+14);c.quadraticCurveTo(x,by+19,x+w*.4,by+14);c.stroke();
 c.restore();}

function toraNaAgua(c,x,y,w,s){c.save();
 c.fillStyle=lg(c,0,y-8*s,0,y+8*s,['#9a7550','#6e4c2e','#4b321d']);
 c.beginPath();c.ellipse(x,y,w/2,8*s,0,0,7);c.fill();
 c.strokeStyle='rgba(40,25,12,.45)';c.lineWidth=1;for(let i=0;i<6;i++){const xx=x-w*.4+i*w*.16;c.beginPath();c.moveTo(xx,y-6*s);c.quadraticCurveTo(xx+5*s,y-1*s,xx+2*s,y+5*s);c.stroke();}
 c.fillStyle='#b8946a';c.beginPath();c.ellipse(x+w/2-3*s,y,4*s,7.5*s,0,0,7);c.fill();c.strokeStyle='rgba(90,60,30,.6)';c.beginPath();c.ellipse(x+w/2-3*s,y,2*s,4*s,0,0,7);c.stroke();
 c.strokeStyle='#5d3f25';c.lineWidth=4*s;c.lineCap='round';c.beginPath();c.moveTo(x-w*.3,y-5*s);c.lineTo(x-w*.38,y-18*s);c.stroke();
 c.fillStyle='rgba(120,140,100,.55)';c.fillRect(x-w/2-8,y+2*s,w+16,9*s);
 c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=1.2;c.beginPath();c.ellipse(x,y+3*s,w/2+6,3*s,0,0,Math.PI);c.stroke();
 c.restore();}

function ninhoT(c,x,y,s,by,aberto){c.save();
 c.fillStyle='rgba(120,90,45,.55)';for(let i=0;i<7;i++){const t=i/7,yy=y+6*s+t*(by+12-y-6*s),xx=x+Math.sin(t*3)*4*s;
  c.beginPath();c.ellipse(xx-5*s,yy,2.2*s,1.4*s,0,0,7);c.ellipse(xx+5*s,yy+2*s,2.2*s,1.4*s,0,0,7);c.fill();}
 c.strokeStyle='rgba(120,90,45,.35)';c.lineWidth=1.6*s;c.beginPath();c.moveTo(x,y+6*s);c.quadraticCurveTo(x+4*s,(y+by)/2+6,x+1*s,by+12);c.stroke();
 c.fillStyle='#f4e4bb';c.beginPath();c.ellipse(x,y-1*s,17*s,6.5*s,0,0,7);c.fill();
 c.fillStyle=aberto?'#a8884f':'#c9ab73';c.beginPath();c.ellipse(x,y,12*s,4.2*s,0,0,7);c.fill();
 if(aberto){c.fillStyle='#efe6d0';for(const [a,b] of [[-5,-1],[3,0],[7,-2]]){c.beginPath();c.ellipse(x+a*s,y+b*s,2.6*s,1.6*s,.4,0,7);c.fill();}}
 else{c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(x-3*s,y-1.5*s,6*s,1.4*s,0,0,7);c.fill();}
 c.restore();}

function ninhoJ(c,x,y,s){c.save();
 c.fillStyle='rgba(0,0,0,.15)';c.beginPath();c.ellipse(x,y+2*s,26*s,5*s,0,0,7);c.fill();
 const cs=['#5e4527','#7a5a32','#9b7a45','#6d5a2c','#8c6b3b'];
 for(let i=0;i<26;i++){const a=hsh(i+x*.01)*Math.PI,r=hsh(i*3.1)*20*s,xx=x+Math.cos(a)*r*1.1-0,yy=y-Math.sin(a)*r*.7;c.fillStyle=cs[i%5];c.beginPath();c.ellipse(xx,yy,6*s,2.6*s,hsh(i*7.7)*3,0,7);c.fill();}
 c.strokeStyle='#4a3520';c.lineWidth=1.4*s;for(let i=0;i<6;i++){const a=hsh(i*5.3)*Math.PI;c.beginPath();c.moveTo(x+Math.cos(a)*6*s,y-Math.sin(a)*6*s);c.lineTo(x+Math.cos(a)*24*s,y-Math.sin(a)*16*s);c.stroke();}
 c.strokeStyle='#6f9a45';c.lineWidth=1.3;for(let i=0;i<8;i++){const xx=x-26*s+i*7.5*s;c.beginPath();c.moveTo(xx,y+3*s);c.quadraticCurveTo(xx+2*s,y-8*s,xx+4*s,y-14*s);c.stroke();}

function pick(pool){let s=pool.reduce((a,b)=>a+b[1],0),r=Math.random()*s;for(const [k,w] of pool){r-=w;if(r<=0)return k;}return pool[0][0];}

 else if(tp==='filhotes'){const w=190;g.ob.push({k:'praia',x,w});g.ob.push({k:'ninhoAb',x:x-40,y:by-3});const n=3+Math.floor(Math.random()*3);

function centro(o){const sx=o.x-S.g.dist,s=esc2(o.y);
 if(o.k==='q')return [sx+(o.d||1)*8*s,o.y-14*s,Math.max(26,36*s)];
 if(o.k==='ninhoT')return [sx,o.y,30];if(o.k==='ninhoJ')return [sx,o.y-8,32];
 if(o.k==='filhote')return [sx+3,o.y-4,22];if(o.k==='jacare')return [sx,o.y-6,48];return null;}
function ativo(o){return (o.k==='q'||o.k==='ninhoT'||o.k==='ninhoJ'||o.k==='filhote'||o.k==='jacare')&&!o.reg&&!o.err&&!o.out&&!o.dive;}

function perdeu(o,x,y){const g=S.g;S.fp-=3;g.miss++;g.combo=0;pop(x,y,'−3','#c62828');msg(o.k==='filhote'?'Filhote entrou na água sem registro':o.k==='ninhoT'?'Ninho ficou sem registro':'Tracajá mergulhou sem registro');}
function cat(o){return o.k==='ninhoT'?'n':o.k==='filhote'?'f':'a';}

function update(dt){const g=S.g;if(!g||g.fim)return;const F=FASES[S.f],by=BY();
 g.t+=dt;g.dist+=F.vel*dt;g.msgT-=dt;g.flash=Math.max(0,g.flash-dt*3);
 while(g.next<g.dist+W+80){spawn(g.next);g.next+=rr(...F.gap)*(MOB()?.82:1);}
